<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Planaria Research{% endblock %}</title>

    <!-- Bootstrap and JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        integrity="sha384-tViUnnbYAV00FLIhhi3v/dWt3Jxw4gZQcNoSCxCIFNJVCx7/D55/wXsrNIRANwdD"
        crossorigin="anonymous">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
        crossorigin="anonymous">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

    {% block scripts %}{% endblock %}
</head>

<body class="body gradient-container">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark nb-background-color shadow">
      <a class="navbar-brand" href="{{ url_for('index') }}">
        <img src="{{ url_for('static', filename='img/logo.png') }}"
             alt="Planaria Logo"
             class="d-inline-block align-text-top w-50 p-2">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navmenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navmenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link hover-underline-animation nvMenuItem"
               href="{{ url_for('authors') }}">Authors</a>
          </li>
          <li class="nav-item">
            <a class="nav-link hover-underline-animation nvMenuItem"
               href="{{ url_for('procedure') }}">Procedure</a>
          </li>
          <li class="nav-item">
            <a class="nav-link hover-underline-animation nvMenuItem"
               href="{{ url_for('results') }}">Results</a>
          </li>
        </ul>
      </div>
    </nav>

    <!-- Main content block -->
    <div class="container-fluid">
      {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="footer p-3 d-flex text-light text-center position-relative justify-content-center align-items-center shadow">
      <div class="container position-relative">
          <p class="lead mt-2 mb-2">
              Copyright &copy; 
              <span id="year">2024</span>
              Medhansh Puri
          </p>
      </div>
    </footer>
</body>
</html>
